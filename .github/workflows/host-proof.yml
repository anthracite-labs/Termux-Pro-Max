name: Execution proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Record host and source identity
        run: |
          mkdir -p termux-pro-app/build/evidence
          {
            git rev-parse HEAD
            uname -sm
            gcc --version
            python3 --version
            java -version
            javac -version
          } > termux-pro-app/build/evidence/host-environment.log 2>&1
      - name: Check shell syntax and patch whitespace
        run: |
          for script in termux-pro-app/gradlew termux-pro-app/proof/build-native.sh termux-pro-app/run-device-proof.sh termux-pro-app/ci/*.sh; do
            bash -n "$script"
          done
          git diff --check HEAD^ HEAD
      - name: Run host regressions (Android gates remain NOT RUN)
        run: |
          set -o pipefail
          python3 -m unittest discover -s termux-pro-app/tests -v 2>&1 | tee termux-pro-app/build/evidence/host-tests.log
      - name: Preserve host evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-proof-evidence
          path: termux-pro-app/build/evidence/*.log
          retention-days: 14

  android-apk:
    needs: host-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      - name: Install the fixed Android build tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358
      - name: Build and lint the proof APK
        working-directory: termux-pro-app
        run: |
          set -o pipefail
          mkdir -p build/evidence/apk
          {
            git rev-parse HEAD
            java -version
            cat "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
            ./gradlew --version
          } > build/evidence/apk/build-environment.log 2>&1
          ./gradlew --no-daemon :proof:assembleDebug :proof:lintDebug 2>&1 | tee build/evidence/apk/build.log
      - name: Stage the APK and its identity
        working-directory: termux-pro-app
        run: |
          mkdir -p build/apk
          cp proof/build/outputs/apk/debug/proof-debug.apk build/apk/
          git rev-parse HEAD > build/apk/source-revision.txt
          cd build/apk
          sha256sum proof-debug.apk > SHA256SUMS
      - name: Publish the proof APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termux-pro-proof-apk
          path: termux-pro-app/build/apk/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Android build and lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termux-pro-proof-build-logs
          path: |
            termux-pro-app/build/evidence/apk/
            termux-pro-app/proof/build/reports/lint-results-debug.*
          retention-days: 14

  android-arm64:
    needs: android-apk
    # Keep the ARM64 guest requirement; an x86 guest with ABI translation is insufficient.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      - name: Set up the emulator SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Fetch this run's APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: termux-pro-proof-apk
          path: termux-pro-app/build/apk
      - name: Verify APK identity and record unverified state
        working-directory: termux-pro-app
        run: |
          mkdir -p build/evidence/android-arm64
          printf 'E0/E1=UNVERIFIED\nE2/E3=NOT RUN\n' > build/evidence/android-arm64/status.txt
          test "$(cat build/apk/source-revision.txt)" = "$(git rev-parse HEAD)"
          cd build/apk
          shasum -a 256 -c SHA256SUMS
      - name: Run the existing E0/E1 proof on ARM64 Android API 30
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          avd-name: termux-pro-proof-${{ github.run_id }}-${{ github.run_attempt }}
          emulator-port: 5580
          emulator-boot-timeout: 300
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel off
          working-directory: termux-pro-app
          script: bash ci/run-android-proof.sh build/apk/proof-debug.apk
      - name: Record emulator diagnostics
        if: always()
        working-directory: termux-pro-app
        env:
          ANDROID_SERIAL: emulator-5580
        run: |
          mkdir -p build/evidence/android-arm64
          {
            uname -sm
            "$ANDROID_HOME/emulator/emulator" -version
            adb devices -l
          } > build/evidence/android-arm64/emulator-environment.log 2>&1
          adb logcat -d -v threadtime > build/evidence/android-arm64/post-action-logcat.log 2>&1 || true
      - name: Preserve device logs even when the proof fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termux-pro-proof-device-logs
          path: |
            termux-pro-app/build/evidence/android-arm64/
            termux-pro-app/build/evidence/device.log
          if-no-files-found: error
          retention-days: 14
