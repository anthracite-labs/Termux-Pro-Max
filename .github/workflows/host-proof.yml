name: Host proof regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/execution-proof]

permissions:
  contents: read

jobs:
  host-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Record host and source identity
        run: |
          mkdir -p termux-pro-app/build/evidence
          {
            git rev-parse HEAD
            uname -sm
            gcc --version
            python3 --version
            java -version
            javac -version
          } > termux-pro-app/build/evidence/host-environment.log 2>&1
      - name: Check shell syntax and patch whitespace
        run: |
          bash -n termux-pro-app/gradlew termux-pro-app/proof/build-native.sh termux-pro-app/run-device-proof.sh
          git diff --check HEAD^ HEAD
      - name: Run host regressions (Android gates remain NOT RUN)
        run: |
          set -o pipefail
          python3 -m unittest discover -s termux-pro-app/tests -v 2>&1 | tee termux-pro-app/build/evidence/host-tests.log
      - name: Preserve host evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-proof-evidence
          path: termux-pro-app/build/evidence/*.log
          retention-days: 14
